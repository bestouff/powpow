[package]
name = "powpow"
version = "1.19.6"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.2", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "query", "form"] }
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "uuid",
  "macros",
  "migrate",
] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
config = "0.15.27"
dotenvy = "0.15.7"
serde_urlencoded = "0.7.1"
maud = { version = "0.27.0", features = ["axum"] }
rlibphonenumber = "2.2.14"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
lettre = { version = "0.11.23", features = [
  "tokio1-native-tls",
  "smtp-transport",
  "builder",
] }
gmail = "0.18.0"
httpclient = "0.26.1"
time = "0.3.55"
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = [
  "alloc",
  "std",
] }
pulldown-cmark = "0.13.4"
ammonia = "4.2.3"
rss = "2.1.2"
unicode-normalization = "0.1.25"
ring = "0.17.14"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tokio-test = "0.4.6"
