name: aghil

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aghil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      LISTEN_ADDRESS: ${LISTEN_ADDRESS}
      DATABASE_URL: postgresql://postgres:password@postgres:5432/aghil
      HELLOASSO_CLIENT_ID: ${HELLOASSO_CLIENT_ID}
      HELLOASSO_CLIENT_SECRET: ${HELLOASSO_CLIENT_SECRET}
      HELLOASSO_ASSOCIATION_SLUG: ${HELLOASSO_ASSOCIATION_SLUG}
      MAIL_METHOD: ${MAIL_METHOD:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      GMAIL_ACCESS_TOKEN: ${GMAIL_ACCESS_TOKEN:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_FROM: ${GMAIL_FROM:-}
      MAIL_DESTINATION_ADDRESS_OVERRIDE: ${MAIL_DESTINATION_ADDRESS_OVERRIDE:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      RUST_LOG: debug
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: aghil_postgres_data
